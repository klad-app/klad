[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.15"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/klad-app/klad"
publish = false

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package.klad-cli]
opt-level = 1

[profile.release]
debug = 1

[profile.dist]
inherits = "release"
debug = 0
strip = "symbols"
lto = "thin"

[profile.dev.package."*"]
opt-level = 3
