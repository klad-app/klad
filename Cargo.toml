[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/klad-app/klad"
publish = false

[profile.release]
debug = 1

[profile.dist]
inherits = "release"
debug = 0
strip = "symbols"
lto = "thin"

[profile.dev.package."*"]
opt-level = 3
