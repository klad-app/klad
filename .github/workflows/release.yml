name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/check.yml

  windows:
    needs: check
    runs-on: windows-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: bash packaging/archive.sh x86_64-pc-windows-msvc dist
      # TODO: sign klad.exe and klad-editor.exe before they are pushed
      - name: Push to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        shell: bash
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          ./butler/butler.exe push dist/klad-*-windows-x86_64 "$ITCH_TARGET:windows" --userversion "${GITHUB_REF_NAME#v}"

  release:
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "klad $version" > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "klad ${GITHUB_REF_NAME#v}" --notes-file notes.md
