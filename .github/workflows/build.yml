name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: target
          - name: Linux
            os: ubuntu-24.04
            target: target/linux
          - name: Windows
            os: windows-latest
            target: target/windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: The Linux packages the README lists
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ${{ matrix.target }}"
      - name: just compile, as the README says
        run: |
          set -o pipefail
          just compile 2>&1 | tee compile.log
      - name: Paint and render a stroke with the build
        run: |
          set -o pipefail
          klad="${{ matrix.target }}/release/klad"
          {
            "$klad" new smoke.klad --width 400 --height 300
            "$klad" stroke smoke.klad l1 --brush oil --size 20 --color '#d4612c' --path 'M40 150 C 140 40 260 260 360 150'
            "$klad" render smoke.klad --out smoke.png
            "$klad" skill drawing > skill.txt
            head -n 2 skill.txt
          } 2>&1 | tee smoke.log
      - name: The tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee tests.log
      - name: Say what happened
        if: always()
        run: |
          said() {
            [ -f "$1.log" ] || return 0
            echo "#### $1"
            echo '```'
            grep -n -E "^error|^warning: unused|panicked at|FAILED|test result|cannot find|not found|No such file|could not" "$1.log" | tail -n 40 || true
            echo "... the last lines:"
            tail -n 30 "$1.log"
            echo '```'
          }
          {
            echo "### ${{ matrix.name }}: tests ${{ steps.tests.outcome }}"
            echo "$(rustc --version 2>&1), $(just --version 2>&1)"
            said compile
            said smoke
            said tests
          } >> "$GITHUB_STEP_SUMMARY"
          for log in compile smoke; do
            [ -f "$log.log" ] || continue
            { grep -m 6 -E "^error|panicked at" "$log.log" || true; } | while read -r line; do
              echo "::warning title=${{ matrix.name }} $log::$line"
            done
          done
          if [ -f tests.log ]; then
            failed="$({ grep -E "^test .* FAILED$" tests.log || true; } | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | sort -u | tr '\n' ' ')"
            [ -z "$failed" ] || echo "::warning title=${{ matrix.name }} tests that failed::$failed"
            { grep -A 3 "panicked at" tests.log || true; } | { grep -v "^--$" || true; } | paste -d ' ' - - - - | cut -c1-600 | head -n 8 | while read -r line; do
              echo "::warning title=${{ matrix.name }} test failure::$line"
            done
            { grep -E "^test result|^error" tests.log || true; } | { grep -v " 0 failed" || true; } | head -n 4 | while read -r line; do
              echo "::warning title=${{ matrix.name }} tests::$line"
            done
          fi
      - name: The main stack klad was linked with
        if: always() && runner.os == 'Windows'
        run: |
          for exe in "${{ matrix.target }}/release/klad.exe" "${{ matrix.target }}/debug/klad.exe"; do
            [ -f "$exe" ] || continue
            reserve="$(python -c "import struct, sys; b = open(sys.argv[1], 'rb').read(4096); o = struct.unpack_from('<I', b, 0x3c)[0]; print(struct.unpack_from('<Q', b, o + 96)[0])" "$exe")"
            echo "::notice title=Windows main stack::$exe is linked with $reserve bytes"
          done
      - name: The tests must pass
        if: steps.tests.outcome == 'failure'
        run: exit 1
